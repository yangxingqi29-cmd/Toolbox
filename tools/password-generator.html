<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Password Generator — Strong Random Passwords</title>
<meta name="description" content="Free secure password generator. Create strong random passwords with custom length and character sets. Runs entirely in your browser.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">Tool<span>box</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<script src="../js/nav.js"></script>

<main>
  <div class="wrap">

    <div class="breadcrumb"><a href="../index.html">Home</a> / Password Generator</div>

    <div class="tool-head">
      <h1>Password Generator</h1>
      <p>Generate strong passwords with a cryptographically secure random source. Nothing is sent anywhere.</p>
    </div>

    <div class="ad-slot leaderboard" data-ad="pw-top">Ad slot — 728x90 / responsive</div>

    <div class="panel">

      <div class="field">
        <label>Generated password</label>
        <div class="out lg" id="pwd" style="justify-content:flex-start;font-size:18px">—</div>
        <div class="strength"><i id="bar"></i></div>
        <div class="hint" id="strengthTxt">—</div>
      </div>

      <div class="btn-row" style="margin-bottom:18px">
        <button class="btn" id="gen">&#8635; Generate</button>
        <button class="btn ghost" id="copy">Copy</button>
      </div>

      <div class="field">
        <label for="length">Length: <b id="lenVal">16</b></label>
        <input type="range" id="length" min="4" max="64" value="16">
      </div>

      <div class="grid-2">
        <div>
          <label class="chk"><input type="checkbox" id="upper" checked> Uppercase (A-Z)</label>
          <label class="chk"><input type="checkbox" id="lower" checked> Lowercase (a-z)</label>
        </div>
        <div>
          <label class="chk"><input type="checkbox" id="digits" checked> Numbers (0-9)</label>
          <label class="chk"><input type="checkbox" id="symbols" checked> Symbols (!@#$…)</label>
        </div>
      </div>
      <div class="field" style="margin-top:6px">
        <label class="chk"><input type="checkbox" id="noAmb"> Avoid ambiguous (0 O o 1 l I |)</label>
      </div>

    </div>

    <div class="ad-slot rect" data-ad="pw-mid">Ad slot — 300x250</div>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>&copy; 2026 Toolbox. Generated locally with Web Crypto.</span>
    <span><a href="../index.html">Home</a> &middot; <a href="../privacy.html">Privacy</a></span>
  </div>
</footer>

<script src="../js/password.js"></script>
</body>
</html>

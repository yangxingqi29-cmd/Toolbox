<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="Password Generator — Strong Random Passwords">Password Generator — Strong Random Passwords</title>
<meta name="description" content="Free secure password generator. Create strong random passwords with custom length and character sets. Runs entirely in your browser." data-i18n-content="Free secure password generator. Create strong random passwords with custom length and character sets. Runs entirely in your browser.">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">Tool<span>box</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<script src="../js/nav.js"></script>

<main>
  <div class="wrap">

    <div class="breadcrumb"><a href="../index.html" data-i18n="Home">Home</a> <span>/</span> <span data-i18n="Password Generator">Password Generator</span></div>

    <div class="tool-head">
      <h1 data-i18n="Password Generator">Password Generator</h1>
      <p data-i18n="Generate strong passwords with a cryptographically secure random source. Nothing is sent anywhere.">Generate strong passwords with a cryptographically secure random source. Nothing is sent anywhere.</p>
    </div>

    <div class="ad-slot leaderboard" data-ad="pw-top" data-i18n="Ad slot — 728x90 / responsive">Ad slot — 728x90 / responsive</div>

    <div class="panel">

      <div class="field">
        <label data-i18n="Generated password">Generated password</label>
        <div class="out lg" id="pwd" style="justify-content:flex-start;font-size:18px">—</div>
        <div class="strength"><i id="bar"></i></div>
        <div class="hint" id="strengthTxt">—</div>
      </div>

      <div class="btn-row" style="margin-bottom:18px">
        <button class="btn" id="gen" data-i18n="↻ Generate">&#8635; Generate</button>
        <button class="btn ghost" id="copy" data-i18n="Copy">Copy</button>
      </div>

      <div class="field">
        <label for="length"><span data-i18n="Length:">Length:</span> <b id="lenVal">16</b></label>
        <input type="range" id="length" min="4" max="64" value="16">
      </div>

      <div class="grid-2">
        <div>
          <label class="chk"><input type="checkbox" id="upper" checked> <span data-i18n="Uppercase (A-Z)">Uppercase (A-Z)</span></label>
          <label class="chk"><input type="checkbox" id="lower" checked> <span data-i18n="Lowercase (a-z)">Lowercase (a-z)</span></label>
        </div>
        <div>
          <label class="chk"><input type="checkbox" id="digits" checked> <span data-i18n="Numbers (0-9)">Numbers (0-9)</span></label>
          <label class="chk"><input type="checkbox" id="symbols" checked> <span data-i18n="Symbols (!@#$…)">Symbols (!@#$…)</span></label>
        </div>
      </div>
      <div class="field" style="margin-top:6px">
        <label class="chk"><input type="checkbox" id="noAmb"> <span data-i18n="Avoid ambiguous (0 O o 1 l I |)">Avoid ambiguous (0 O o 1 l I |)</span></label>
      </div>

    </div>

    <div class="ad-slot rect" data-ad="pw-mid" data-i18n="Ad slot — 300x250">Ad slot — 300x250</div>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span data-i18n="© 2026 Toolbox. Generated locally with Web Crypto.">&copy; 2026 Toolbox. Generated locally with Web Crypto.</span>
    <span><a href="../index.html" data-i18n="Home">Home</a> &middot; <a href="../privacy.html" data-i18n="Privacy">Privacy</a></span>
  </div>
</footer>

<script src="../js/password.js"></script>
</body>
</html>

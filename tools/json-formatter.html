<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JSON Formatter & Validator — Pretty Print, Minify</title>
<meta name="description" content="Free online JSON formatter and validator. Pretty-print, minify, sort keys and check JSON syntax with line numbers. Runs in your browser.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">Tool<span>box</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<script src="../js/nav.js"></script>

<main>
  <div class="wrap">

    <div class="breadcrumb"><a href="../index.html">Home</a> / JSON Formatter</div>

    <div class="tool-head">
      <h1>JSON Formatter & Validator</h1>
      <p>Pretty-print, minify and validate JSON. Errors are reported with line and column.</p>
    </div>

    <div class="ad-slot leaderboard" data-ad="json-top">Ad slot — 728x90 / responsive</div>

    <div class="panel">
      <div class="field">
        <label for="input">JSON input</label>
        <textarea id="input" rows="9" placeholder='{"hello":"world","items":[1,2,3]}' spellcheck="false"></textarea>
      </div>

      <div class="grid-2" style="margin-bottom:14px">
        <div class="field" style="margin:0">
          <label for="indent">Indent</label>
          <select id="indent">
            <option value="2" selected>2 spaces</option>
            <option value="4">4 spaces</option>
            <option value="1">1 space</option>
            <option value="0">Tab-less (compact)</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end">
          <label class="chk" style="margin:0">
            <input type="checkbox" id="sortkeys"> Sort keys alphabetically
          </label>
        </div>
      </div>

      <div class="btn-row" style="margin-bottom:16px">
        <button class="btn" id="format">Format</button>
        <button class="btn ghost" id="minify">Minify</button>
        <button class="btn ghost sm" id="copy">Copy result</button>
        <button class="btn ghost sm" id="clear">Clear</button>
      </div>

      <div class="field">
        <label for="output">Output</label>
        <textarea id="output" rows="9" spellcheck="false" readonly></textarea>
      </div>

      <div class="hint" id="status"></div>
    </div>

    <div class="ad-slot rect" data-ad="json-mid">Ad slot — 300x250</div>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>&copy; 2026 Toolbox. All tools run locally in your browser.</span>
    <span><a href="../index.html">Home</a> &middot; <a href="../privacy.html">Privacy</a></span>
  </div>
</footer>

<script src="../js/json-formatter.js"></script>
</body>
</html>

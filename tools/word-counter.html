<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="Word Counter — Characters, Words, Reading Time">Word Counter — Characters, Words, Reading Time</title>
<meta name="description" content="Free online word counter. Count words, characters, sentences and paragraphs, estimate reading time, and see the most frequent words." data-i18n-content="Free online word counter. Count words, characters, sentences and paragraphs, estimate reading time, and see the most frequent words.">
<link rel="stylesheet" href="../css/style.css">
<script src="../js/i18n.js"></script>
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">Tool<span>box</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<script src="../js/nav.js"></script>

<main>
  <div class="wrap">

    <div class="breadcrumb"><a href="../index.html" data-i18n="Home">Home</a> <span>/</span> <span data-i18n="Word Counter">Word Counter</span></div>

    <div class="tool-head">
      <h1 data-i18n="Word Counter">Word Counter</h1>
      <p data-i18n="Live word, character and sentence counts with reading time. Handles English and Chinese text.">Live word, character and sentence counts with reading time. Handles English and Chinese text.</p>
    </div>

    <div class="ad-slot leaderboard" data-ad="wc-top" data-i18n="Ad slot — 728x90 / responsive">Ad slot — 728x90 / responsive</div>

    <div class="panel">
      <div class="field">
        <label for="input" data-i18n="Your text">Your text</label>
        <textarea id="input" rows="10" placeholder="Paste or type your text here…" data-i18n-ph="Paste or type your text here…"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn ghost sm" id="copy" data-i18n="Copy stats">Copy stats</button>
        <button class="btn ghost sm" id="clear" data-i18n="Clear">Clear</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h2 style="font-size:16px" data-i18n="Statistics">Statistics</h2>
        <div id="stats"></div>
      </div>
      <div class="panel">
        <h2 style="font-size:16px" data-i18n="Most frequent words">Most frequent words</h2>
        <div id="topwords"></div>
      </div>
    </div>

    <div class="ad-slot rect" data-ad="wc-mid" data-i18n="Ad slot — 300x250">Ad slot — 300x250</div>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span data-i18n="© 2026 Toolbox. All tools run locally in your browser.">&copy; 2026 Toolbox. All tools run locally in your browser.</span>
    <span><a href="../index.html" data-i18n="Home">Home</a> &middot; <a href="../privacy.html" data-i18n="Privacy">Privacy</a></span>
  </div>
</footer>

<script src="../js/word-counter.js"></script>

</html>

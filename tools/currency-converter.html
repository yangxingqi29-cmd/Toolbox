<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Currency Converter — Live Exchange Rates</title>
<meta name="description" content="Free online currency converter with live exchange rates. Convert between USD, EUR, GBP, JPY, CNY and 30+ currencies.">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site">
  <div class="wrap">
    <a class="brand" href="../index.html">Tool<span>box</span></a>
    <nav id="nav"></nav>
  </div>
</header>
<script src="../js/nav.js"></script>

<main>
  <div class="wrap">

    <div class="breadcrumb"><a href="../index.html">Home</a> / Currency Converter</div>

    <div class="tool-head">
      <h1>Currency Converter</h1>
      <p>Convert between 30+ currencies using live exchange rates.</p>
    </div>

    <div class="ad-slot leaderboard" data-ad="fx-top">Ad slot — 728x90 / responsive</div>

    <div class="panel">

      <div class="row">
        <div class="field">
          <label for="amount">Amount</label>
          <input id="amount" type="number" value="100" step="any" inputmode="decimal">
        </div>
        <div class="field">
          <label for="from">From</label>
          <select id="from"></select>
        </div>
      </div>

      <div class="field">
        <label for="to">To</label>
        <select id="to"></select>
      </div>

      <div class="btn-row" style="margin-bottom:16px">
        <button class="btn" id="swap">&#8646; Swap</button>
        <button class="btn ghost sm" id="refresh">Refresh rates</button>
      </div>

      <div class="out lg" id="result">—</div>
      <div class="hint" id="rate">Fetching live rates…</div>

    </div>

    <div class="ad-slot rect" data-ad="fx-mid">Ad slot — 300x250</div>

    <section class="panel">
      <h2>Popular conversions</h2>
      <div id="popular" class="grid-2"></div>
    </section>

  </div>
</main>

<footer class="site">
  <div class="wrap">
    <span>&copy; 2026 Toolbox. Rates from open exchange-rate API.</span>
    <span><a href="../index.html">Home</a> &middot; <a href="../privacy.html">Privacy</a></span>
  </div>
</footer>

<script src="../js/currency.js"></script>
</body>
</html>
